; Friend or Foe — Unit Tests (native)
; Scanner and Uplink have their own platformio.ini in their subdirectories.

[platformio]
src_dir = .
test_dir = test

[env:test]
platform = native
test_framework = unity
test_build_src = yes
extra_scripts =
    pre:test/link_math.py
build_flags =
    -Ishared
    -Iscanner/main/detection
    -Iscanner/main/core
    -Iuplink/main/network
    -Iuplink/main/core
    -Itest/stubs
    -DUNITY_INCLUDE_DOUBLE
    -DUNIT_TESTING
    -DSCANNER_ROLLBACK_HOST_TEST
    -DFW_AUTO_CHECK_HOST_TEST
    -DFOF_DC34_GAME_CANARY=1
    -fsanitize=address
    -fno-omit-frame-pointer
build_src_filter =
    +<shared/badge_con_encounter.c>
    +<shared/badge_con_game.c>
    +<shared/badge_con_presentation.c>
    +<shared/badge_con_protocol.c>
