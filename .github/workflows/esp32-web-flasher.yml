name: ESP32 Web Flasher

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'esp32/**'
      - 'tools/badge_flasher/**'
      - 'scripts/build_badge_factory_bundle.py'
      - '.github/workflows/esp32-web-flasher.yml'
  pull_request:
    branches: [main]
    paths:
      - 'esp32/**'
      - 'tools/badge_flasher/**'
      - 'scripts/build_badge_factory_bundle.py'
      - '.github/workflows/esp32-web-flasher.yml'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: esp32-web-flasher
  cancel-in-progress: true

jobs:
  # ── Build firmware ──────────────────────────────────────────────────────────
  build:
    # Android-only app releases use tags like vX.Y.Z-android-... so the app's
    # GitHub update check can see them without packaging firmware assets.
    if: ${{ !((github.event_name == 'release' && contains(github.event.release.tag_name, '-android-')) || (github.event_name != 'release' && contains(github.ref_name, '-android-'))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio pytest

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('esp32/platformio.ini', 'esp32/scanner/platformio.ini', 'esp32/uplink/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Create wifi_credentials.h from template (CI builds with defaults)
        run: cp esp32/uplink/main/core/wifi_credentials.h.example esp32/uplink/main/core/wifi_credentials.h

      - name: Run native ESP32 unit tests
        run: cd esp32 && pio test -e test

      - name: Test badge factory host tool
        run: python -m unittest discover -s tools/badge_flasher/tests -p 'test_*.py' -v

      - name: Test portable badge release guard
        run: cd scripts && python -m pytest test_fof_flash_release.py -q

      - name: Test firmware build-version guard
        run: python -m pytest backend/tests/test_firmware_build_version.py -q

      - name: Build Scanner firmware (ESP32-S3 combo)
        run: umask 0022 && cd esp32/scanner && pio run -e scanner-s3-combo

      - name: Build Scanner firmware (ESP32-S3 combo seed)
        run: umask 0022 && cd esp32/scanner && pio run -e scanner-s3-combo-seed

      - name: Build Uplink firmware (ESP32-S3)
        run: umask 0022 && cd esp32/uplink && pio run -e uplink-s3

      - name: Harden PlatformIO partition generator mode
        run: >-
          chmod 0644
          "$HOME/.platformio/packages/framework-espidf/components/partition_table/gen_esp32part.py"

      - name: Build Badge Scanner firmware (XIAO ESP32-S3)
        run: >-
          umask 0022 &&
          cd esp32/scanner &&
          pio run -e scanner-s3-combo-fof_badge

      - name: Verify Badge Scanner flash manifests
        run: >-
          python esp32/scripts/verify_badge_scanner_build.py
          --build-dir esp32/scanner/.pio/build/scanner-s3-combo-fof_badge
          --partition-source esp32/scanner/partitions_s3_scanner_8mb.csv
          --sdkconfig esp32/scanner/sdkconfig.scanner-s3-combo-fof_badge

      - name: Build private Badge Scanner canary
        run: >-
          umask 0022 &&
          cd esp32/scanner &&
          pio run -e scanner-s3-combo-fof_badge-con-crud-canary

      - name: Verify private Badge Scanner canary
        run: >-
          python esp32/scripts/verify_badge_scanner_build.py
          --build-dir
          esp32/scanner/.pio/build/scanner-s3-combo-fof_badge-con-crud-canary
          --partition-source esp32/scanner/partitions_s3_scanner_8mb.csv
          --sdkconfig
          esp32/scanner/sdkconfig.scanner-s3-combo-fof_badge-con-crud-canary
          --canary-production-build-dir
          esp32/scanner/.pio/build/scanner-s3-combo-fof_badge

      - name: Build Badge Uplink firmware (XIAO ESP32-S3)
        run: >-
          umask 0022 &&
          cd esp32/uplink &&
          pio run -e uplink-s3-fof_badge

      - name: Verify Badge Uplink flash manifests
        run: >-
          python esp32/scripts/verify_badge_uplink_build.py
          --build-dir esp32/uplink/.pio/build/uplink-s3-fof_badge
          --partition-source esp32/uplink/partitions_s3_fof_badge_8mb.csv

      - name: Build private Badge Uplink canary
        run: >-
          umask 0022 &&
          cd esp32/uplink &&
          pio run -e uplink-s3-fof_badge-con-crud-canary

      - name: Verify private Badge Uplink canary
        run: >-
          python esp32/scripts/verify_badge_uplink_build.py
          --build-dir
          esp32/uplink/.pio/build/uplink-s3-fof_badge-con-crud-canary
          --partition-source esp32/uplink/partitions_s3_fof_badge_8mb.csv
          --sdkconfig
          esp32/uplink/sdkconfig.uplink-s3-fof_badge-con-crud-canary
          --canary-production-build-dir
          esp32/uplink/.pio/build/uplink-s3-fof_badge

      - name: Build Badge factory topology probe (XIAO ESP32-S3)
        run: >-
          umask 0022 &&
          cd esp32/factory-probe &&
          pio run -e factory-probe-s3

      - name: Verify embedded firmware versions
        run: python esp32/scripts/verify_firmware_versions.py --repo-root .

      - name: Package private CON CRUD canary artifact
        run: |
          mkdir -p private-canary/badge-scanner
          mkdir -p private-canary/badge-uplink

          cp esp32/scanner/.pio/build/scanner-s3-combo-fof_badge-con-crud-canary/bootloader.bin private-canary/badge-scanner/
          cp esp32/scanner/.pio/build/scanner-s3-combo-fof_badge-con-crud-canary/partitions.bin private-canary/badge-scanner/partition-table.bin
          cp esp32/scanner/.pio/build/scanner-s3-combo-fof_badge-con-crud-canary/firmware.bin private-canary/badge-scanner/

          cp esp32/uplink/.pio/build/uplink-s3-fof_badge-con-crud-canary/bootloader.bin private-canary/badge-uplink/
          cp esp32/uplink/.pio/build/uplink-s3-fof_badge-con-crud-canary/partitions.bin private-canary/badge-uplink/partition-table.bin
          cp esp32/uplink/.pio/build/uplink-s3-fof_badge-con-crud-canary/firmware.bin private-canary/badge-uplink/

          find private-canary -name '*.bin' -exec ls -lh {} \;

      - name: Upload private CON CRUD canary artifact
        uses: actions/upload-artifact@v4
        with:
          name: con-crud-canary-${{ github.sha }}
          path: private-canary/
          retention-days: 14

      - name: Package firmware binaries
        run: |
          mkdir -p firmware/scanner firmware/scanner-seed firmware/uplink-s3
          mkdir -p firmware/badge-scanner firmware/badge-uplink

          cp esp32/scanner/.pio/build/scanner-s3-combo/bootloader.bin firmware/scanner/
          cp esp32/scanner/.pio/build/scanner-s3-combo/partitions.bin firmware/scanner/partition-table.bin
          cp esp32/scanner/.pio/build/scanner-s3-combo/firmware.bin   firmware/scanner/

          cp esp32/scanner/.pio/build/scanner-s3-combo-seed/bootloader.bin firmware/scanner-seed/
          cp esp32/scanner/.pio/build/scanner-s3-combo-seed/partitions.bin firmware/scanner-seed/partition-table.bin
          cp esp32/scanner/.pio/build/scanner-s3-combo-seed/firmware.bin   firmware/scanner-seed/

          cp esp32/uplink/.pio/build/uplink-s3/bootloader.bin firmware/uplink-s3/
          cp esp32/uplink/.pio/build/uplink-s3/partitions.bin firmware/uplink-s3/partition-table.bin
          cp esp32/uplink/.pio/build/uplink-s3/firmware.bin   firmware/uplink-s3/

          cp esp32/scanner/.pio/build/scanner-s3-combo-fof_badge/bootloader.bin firmware/badge-scanner/
          cp esp32/scanner/.pio/build/scanner-s3-combo-fof_badge/partitions.bin firmware/badge-scanner/partition-table.bin
          cp esp32/scanner/.pio/build/scanner-s3-combo-fof_badge/firmware.bin   firmware/badge-scanner/

          cp esp32/uplink/.pio/build/uplink-s3-fof_badge/bootloader.bin firmware/badge-uplink/
          cp esp32/uplink/.pio/build/uplink-s3-fof_badge/partitions.bin firmware/badge-uplink/partition-table.bin
          cp esp32/uplink/.pio/build/uplink-s3-fof_badge/firmware.bin   firmware/badge-uplink/

          echo "=== Firmware sizes ==="
          find firmware -name '*.bin' -exec ls -lh {} \;

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: firmware/
          retention-days: 90

      - name: Build validated badge factory bundle
        run: |
          mkdir -p factory-bundle
          python scripts/build_badge_factory_bundle.py \
            --output factory-bundle/badge-factory-flasher.zip

      - name: Upload badge factory bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: badge-factory-flasher
          path: factory-bundle/badge-factory-flasher.zip
          retention-days: 90

      - name: Attach firmware to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes --target "$GITHUB_SHA" || true
          fi
          for i in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done
          gh release view "$TAG" >/dev/null

          cp firmware/scanner/firmware.bin      /tmp/scanner-s3-combo-${TAG}.bin
          cp firmware/scanner-seed/firmware.bin /tmp/scanner-s3-combo-seed-${TAG}.bin
          cp firmware/uplink-s3/firmware.bin    /tmp/uplink-s3-${TAG}.bin
          cp firmware/badge-scanner/firmware.bin /tmp/scanner-s3-combo-fof_badge-${TAG}.bin
          cp firmware/badge-uplink/firmware.bin  /tmp/uplink-s3-fof_badge-${TAG}.bin
          cp factory-bundle/badge-factory-flasher.zip /tmp/badge-factory-flasher-${TAG}.zip
          cd firmware/scanner        && tar czf /tmp/scanner-firmware-${TAG}.tar.gz *.bin && cd -
          cd firmware/scanner-seed   && tar czf /tmp/scanner-seed-firmware-${TAG}.tar.gz *.bin && cd -
          cd firmware/uplink-s3      && tar czf /tmp/uplink-s3-firmware-${TAG}.tar.gz *.bin && cd -
          cd firmware/badge-scanner  && tar czf /tmp/badge-scanner-firmware-${TAG}.tar.gz *.bin && cd -
          cd firmware/badge-uplink   && tar czf /tmp/badge-uplink-firmware-${TAG}.tar.gz *.bin && cd -
          gh release upload "$TAG" \
            /tmp/scanner-s3-combo-${TAG}.bin \
            /tmp/scanner-s3-combo-seed-${TAG}.bin \
            /tmp/uplink-s3-${TAG}.bin \
            /tmp/scanner-s3-combo-fof_badge-${TAG}.bin \
            /tmp/uplink-s3-fof_badge-${TAG}.bin \
            /tmp/scanner-firmware-${TAG}.tar.gz \
            /tmp/scanner-seed-firmware-${TAG}.tar.gz \
            /tmp/uplink-s3-firmware-${TAG}.tar.gz \
            /tmp/badge-scanner-firmware-${TAG}.tar.gz \
            /tmp/badge-uplink-firmware-${TAG}.tar.gz \
            /tmp/badge-factory-flasher-${TAG}.zip \
            --clobber

  # ── Deploy web flasher to GitHub Pages ──────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Deploy Pages for branch/workflow runs, but not pull requests, release
    # events, or tag pushes. Those runs only need build/release validation,
    # and the github-pages environment blocks non-main deployments.
    if: ${{ needs.build.result == 'success' && github.event_name != 'pull_request' && github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/') }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/firmware/scanner _site/firmware/scanner-seed _site/firmware/uplink-s3
          mkdir -p _site/firmware/badge-scanner _site/firmware/badge-uplink

          # Web flasher page + manifests
          cp esp32/web-flasher/index.html                    _site/
          cp esp32/web-flasher/manifest-scanner.json          _site/
          cp esp32/web-flasher/manifest-scanner-seed.json     _site/
          cp esp32/web-flasher/manifest-uplink-s3.json        _site/
          cp esp32/web-flasher/manifest-badge-scanner.json    _site/
          cp esp32/web-flasher/manifest-badge-uplink.json     _site/

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: esp32-firmware
          path: _site/firmware/

      - name: Verify site contents
        run: |
          echo "=== Pages site ==="
          find _site -type f -exec ls -lh {} \;
          python esp32/scripts/verify_firmware_versions.py --repo-root . --site-root _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
