[platformio]
src_dir = .
test_dir = test

[backend_native_base]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -Ishared
    -Iscanner/main/detection
    -Iscanner/main/comms
    -Iscanner/main/core
    -Iuplink/main/comms
    -Iuplink/main/core
    -Iuplink/main/network
    -Iuplink/main/ota
    -Iuplink/main/storage
    -Iuplink/main/usb
    -Iscanner/main/hw
    -Itest/stubs
    -Itest/support
    -Itest/test_backend_led_pattern/adapter_stubs
    -DUNIT_TESTING
    -DFOF_BACKEND_FIRMWARE=1
    -DUNITY_INCLUDE_DOUBLE
    -fsanitize=address
    -fno-omit-frame-pointer
    -lm
build_src_filter =
    +<shared/backend_identity.c>
    +<shared/backend_ap_policy.c>
    +<shared/backend_lite_ap_policy.c>
    +<shared/backend_json_writer.c>
    +<shared/backend_json_reader.c>
    +<shared/backend_detection_codec.c>
    +<shared/backend_ble_investigation.c>
    +<shared/ble_investigation_protocol.c>
    +<shared/backend_detection_router.c>
    +<shared/backend_config.c>
    +<shared/backend_led_pattern.c>
    +<shared/backend_led_protocol.c>
    +<shared/backend_threat_policy.c>
    +<shared/backend_portal_contract.c>
    +<shared/backend_flow_policy.c>
    +<shared/backend_recovery_policy.c>
    +<shared/backend_scanner_control_codec.c>
    +<shared/backend_scanner_role.c>
    +<shared/backend_scanner_status_codec.c>
    +<shared/backend_scanner_topology.c>
    +<shared/backend_upload_batch.c>
    +<shared/backend_upload_fifo.c>
    +<shared/backend_http_policy.c>
    +<shared/backend_ingest_ack.c>
    +<shared/backend_ota_identity.c>
    +<shared/backend_ota_operation_id.c>
    +<shared/firmware_image_contract.c>
    +<shared/firmware_version_order.c>
    +<shared/detection_policy.c>
    +<shared/privacy_rf_signatures.c>
    +<shared/scanner_uart_line_framer.c>
    +<shared/time_sync_policy.c>
    +<scanner/main/core/backend_detection_sink.c>
    +<scanner/main/core/backend_investigation_sink.c>
    +<scanner/main/core/backend_scanner_runtime.c>
    +<scanner/main/comms/backend_uart_rx.c>
    +<scanner/main/comms/backend_uart_tx.c>
    +<scanner/main/comms/uart_ota.c>
    +<scanner/main/core/scanner_rollback.c>
    +<scanner/main/detection/backend_glasses_classifier.c>
    +<scanner/main/detection/backend_feature_adapter.c>
    +<scanner/main/detection/bayesian_fusion.c>
    +<scanner/main/detection/ble_fingerprint.c>
    +<scanner/main/detection/ble_threat_detector.c>
    +<scanner/main/detection/dji_drone_id_parser.c>
    +<scanner/main/detection/french_dri_parser.c>
    +<scanner/main/detection/open_drone_id_parser.c>
    +<scanner/main/detection/wifi_beacon_rid_parser.c>
    +<scanner/main/detection/wifi_oui_database.c>
    +<scanner/main/detection/wifi_ssid_patterns.c>
    +<uplink/main/comms/backend_uart_slot.c>
    +<uplink/main/comms/backend_uart_investigation.c>
    +<uplink/main/comms/production_scanner_uart.c>
    +<uplink/main/core/backend_coordinator.c>
    +<uplink/main/core/backend_dashboard_event.c>
    +<uplink/main/core/backend_live_entities.c>
    +<uplink/main/core/backend_health.c>
    +<uplink/main/network/backend_config_portal.c>
    +<uplink/main/network/backend_command_client.c>
    +<uplink/main/network/backend_http_transport.c>
    +<uplink/main/network/backend_time_sync.c>
    +<uplink/main/network/backend_uploader.c>
    +<uplink/main/network/backend_wifi_manager.c>
    +<uplink/main/storage/backend_firmware_buffer.c>
    +<uplink/main/storage/backend_event_ring.c>
    +<uplink/main/storage/backend_firmware_store.c>
    +<uplink/main/storage/backend_nvs_config.c>
    +<uplink/main/storage/backend_ota_journal.c>
    +<uplink/main/usb/backend_usb_protocol.c>
    +<uplink/main/usb/backend_usb_transport_core.c>
    +<uplink/main/usb/backend_usb_config.c>
    +<uplink/main/ota/backend_ota_maintenance.c>
    +<uplink/main/ota/backend_scanner_relay.c>
    +<uplink/main/ota/backend_self_ota.c>
    +<test/support/backend_test_clock.c>
    +<test/support/backend_detection_assert.c>

[env:backend-native]
extends = backend_native_base
build_flags =
    ${backend_native_base.build_flags}
    -DFOF_BACKEND_PROFILE_BADGE_LITE=1
build_src_filter =
    ${backend_native_base.build_src_filter}
    +<uplink/main/network/backend_dashboard_page.c>

[env:backend-native-fullsize]
extends = backend_native_base
build_flags =
    ${backend_native_base.build_flags}
    -DFOF_BACKEND_PROFILE_S3_FULLSIZE=1
    -DBACKEND_OTA_RECEIPT_FIXTURE_PATH=\"$PROJECT_DIR/test/fixtures/backend_ota_receipt_v1.json\"
    -Ifullsize-components/backend_fullsize_led/include
    -Itest/test_backend_rgb_led_adapter/adapter_stubs
build_src_filter =
    ${backend_native_base.build_src_filter}
    +<shared/backend_rgb_led_pattern.c>
    +<uplink/main/network/backend_ota_command_client.c>
    +<uplink/main/network/backend_ota_workflow.c>
    +<uplink/main/storage/backend_ota_event_outbox.c>
