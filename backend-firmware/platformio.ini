[platformio]
src_dir = .
test_dir = test

[env:backend-native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -Ishared
    -Itest/stubs
    -DUNIT_TESTING
    -DUNITY_INCLUDE_DOUBLE
    -fsanitize=address
    -fno-omit-frame-pointer
build_src_filter =
    +<shared/backend_identity.c>
